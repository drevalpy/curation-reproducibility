        - "*replicate-treatment-info*"
        - "*cell-line-info*"
    transcriptomics:
      files:
        - url: "https://ndownloader.figshare.com/files/22897976"
          fname: "CCLE_expression.csv"
          known_hash: "md5:72ec057ef348693313c2c4eaf548a2d7"
      keep:
        - "CCLE_expression.csv"
# Tiny dataset carved out of an assembled one for fast iteration. n_tissues must
