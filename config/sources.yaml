  # pages through the annotations endpoint and records the retrieval date.
  ncit_heading: "NCI Thesaurus Code"

# Omics downloads shared by several datasets, declared once per source. A dataset
# names the source of each such modality in its `omics` mapping below, and
# `data-curation omics download-shared <source>` fetches each file a single time
# into data/01_raw/<cmp|ccle|gdsc>/<kind>/, where the process stages read it.
# Each kind is one entry (url, known_hash, optional fname) or a `files` list of
# them, plus `keep` (globs of the extracted files the pipeline reads; the rest is
# pruned). known_hash is the hash of the file at `url`, i.e. the archive for a .zip.
#
# As in drevalpy v1 (github.com/daisybio/preprocess_drp_data), gene expression and
# methylation come from each screen's own omics release - GDSC's for GDSC1/2, the
# Broad's CCLE release for CCLE and CTRPv1/v2 - and mutations, CNV and proteomics
# from Cell Model Passports for all five.

# Cell Model Passports: mutations, CNV, proteomics, and the model list that maps
# every cell-line identifier (SIDM, COSMIC, CCLE name, DepMap ID) to Cellosaurus.
cell_model_passports:
  model_list:
    url: "https://cog.sanger.ac.uk/cmp/download/model_list_20260811.csv"
    known_hash: "sha256:f3f5fb866f51d9cf6f89b92da0e9dcb21446b441e5caf8b9220b0031bbc95048"
    fname: "model_list.csv"
  gene_identifiers:
    # HGNC, Ensembl and Entrez IDs of every gene CMP uses. The GDSC and CCLE
    # expression files predate many HGNC renames; their genes take the CMP symbol
    # of their HGNC accession / Ensembl ID, so that they match the CMP omics and
    # drevalpy's gene lists (see omics/gene_symbols.py).
    url: "https://cog.sanger.ac.uk/cmp/download/gene_identifiers_20241212.csv"
    known_hash: "sha256:4dea1c6f302f4e72556feb4852dd0a18dbf619f860d29b2e407f9369bcedb66c"
    fname: "gene_identifiers.csv"
  mutations:
    url: "https://cog.sanger.ac.uk/cmp/download/mutations_all_20260724.zip"
    known_hash: "sha256:66de21ce8e499cc63c98e66485c38671cd99f25bf579adc8a4b10d69e96b9b45"
    keep:
      - "*mutations_all*"
  cnv:
    url: "https://cog.sanger.ac.uk/cmp/download/cnv_20191101.zip"
    known_hash: "sha256:d522dd74c0380077d45474e2a5d02cf6b300080d8d828659776b3f7a209e81bd"
    keep:
      - "*gistic*"
  proteomics:
    # CMP publishes no dated copy of the proteomics matrix (last modified
    # 2025-02-11), so the URL is the unversioned "latest" one. The hash makes any
    # upstream replacement fail the download instead of silently changing results.
    url: "https://cog.sanger.ac.uk/cmp/download/proteomics_latest.csv.gz"
    known_hash: "sha256:3b8032ed18bebd640b26ff20af8a4969a3963986e419d1a647ed291c0e621cca"
    keep:
      - "*proteomics*"

# CCLE 2019 (Ghandi et al., Nature 569:503), the Broad's legacy CCLE release, used
# by CCLE, CTRPv1/v2 (screened on CCLE lines) and, for methylation, PRISM.
# Samples are CCLE names (A549_LUNG), resolved through the model list's CCLE_ID.
ccle:
  transcriptomics:
    # RSEM gene TPMs, and RNA-SeQC gene read counts, which also carry the gene
    # symbols the TPM file lacks. v1 re-quantified the raw reads (PRJNA523380)
    # with nf-core/rnaseq instead; these are the Broad's own quantification.
    files:
      - url: "https://data.broadinstitute.org/ccle/CCLE_RNAseq_rsem_genes_tpm_20180929.txt.gz"
        known_hash: "sha256:612d2e6087364fa89d57e22676a1429f58fa3bf001dfbbe1b16addb9102c651b"
        fname: "CCLE_RNAseq_rsem_genes_tpm_20180929.txt.gz"
      - url: "https://data.broadinstitute.org/ccle/CCLE_RNAseq_genes_counts_20180929.gct.gz"
        known_hash: "sha256:6972b5522a3a1c48aa9b94b66dcb3cd91fe49368aa6eed85fe2475cae02ebe2a"
        fname: "CCLE_RNAseq_genes_counts_20180929.gct.gz"
  methylation:
    # RRBS beta values of the CpG clusters around each transcription start site.
    url: "https://data.broadinstitute.org/ccle/CCLE_RRBS_TSS_CpG_clusters_20180614.txt"
    known_hash: "sha256:35290643c3c9bd78b880514978b9dd667d9a09b8eef2c5fc09d672cf9dff23e9"
    fname: "CCLE_RRBS_TSS_CpG_clusters_20180614.txt"

# GDSC1000 (Iorio et al. 2016, Cell 166:740). cancerrxgene.org no longer serves
# these files (HTTP 410), so they are fetched once from the Internet Archive and
# GEO with `data-curation omics fetch-gdsc` and tracked with `dvc add`
# (data/01_raw/gdsc/<kind>.dvc) rather than by a download stage: the DVC remote
# keeps them, and no stage depends on the archive staying online.
gdsc:
  transcriptomics:
    # RMA-normalised Affymetrix HG-U219 expression, samples keyed by COSMIC ID.
    # Originally https://www.cancerrxgene.org/gdsc1000/GDSC1000_WebResources/Data/preprocessed/Cell_line_RMA_proc_basalExp.txt.zip
    # (an earlier snapshot, 20221005165130, is truncated).
    url: "https://web.archive.org/web/20260209143748id_/https://www.cancerrxgene.org/gdsc1000/GDSC1000_WebResources/Data/preprocessed/Cell_line_RMA_proc_basalExp.txt.zip"
    known_hash: "sha256:a087c0f703050d86e9f108b03096308e541a70fdc105c6ea0a3c85f8f9b3b0d7"
    keep:
      - "Cell_line_RMA_proc_basalExp.txt"
  methylation:
    # Illumina 450K beta values averaged over each CpG island, samples keyed by
    # Sentrix array ID. The archive holds F2_METH_CELL_DATA.txt, the file v1 used.
    # Originally https://www.cancerrxgene.org/gdsc1000/GDSC1000_WebResources/Data/preprocessed/methylation/METH_CELL_DATA.txt.zip
    url: "https://web.archive.org/web/20220616031452id_/https://www.cancerrxgene.org/gdsc1000/GDSC1000_WebResources//Data/preprocessed/methylation/METH_CELL_DATA.txt.zip"
    known_hash: "sha256:dd577a5fca23d5163bad92ad46876b1dbf5e7a9ab1ce753a538106313cedb8f6"
    keep:
      - "F2_METH_CELL_DATA.txt"
  methylation_samples:
    # GEO series of the same arrays: maps each Sentrix ID (in the IDAT file names)
    # to the COSMIC ID of its cell line. Replaces v1's methSampleId_2_cosmicIds.xlsx,
    # which the Internet Archive does not hold.
    url: "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE68nnn/GSE68379/matrix/GSE68379_series_matrix.txt.gz"
    known_hash: "sha256:7c61636fa9ceb61abbea67d86d86f2893d64992f9bb36d987c76b5c4dbdaca6e"
    fname: "GSE68379_series_matrix.txt.gz"

datasets:
  CCLE:
    omics:
      transcriptomics: ccle
      methylation: ccle
      mutations: cell_model_passports
      cnv: cell_model_passports
      proteomics: cell_model_passports
    response:
      # Barretina et al. 2012, Nature 483:603, supplementary table S11 (sheet 11).
      # The PMC copy (NIHMS361223-supplement-4.xlsx) sits behind a proof-of-work
      # challenge that pooch cannot solve - every PMC route returns an HTML
      # interstitial, and the OA package for PMC3320027 is a 404 because the
      # article is licensed "none". Springer serves the byte-identical workbook
      # unauthenticated, so that is the pinned source. It is a legacy .xls, hence
      # the xlrd dependency.
      format: "ccle"
      normalize: false
      files:
        - url: "https://static-content.springer.com/esm/art%3A10.1038%2Fnature11003/MediaObjects/41586_2012_BFnature11003_MOESM90_ESM.xls"
          fname: "barretina2012_supplementary_tables.xls"
