          fname: "CCLE_expression.csv"
          known_hash: "md5:684862866f2b03b5597b0adcbcbad31d"
      keep:
        - "CCLE_expression.csv"
  PRISM_20Q2:
    # PRISM Repurposing 20Q2 secondary screen.
    # Figshare dataset doi:10.6084/m9.figshare.20564034 (CC BY 4.0).
    # Gene expression: CCLE_expression.csv from the DepMap 20Q2 Public release
    # (doi:10.6084/m9.figshare.12280541).
    # Tissue and other cell-line metadata come from Cell Model Passports.
    drug_mapping:
      # This release lists 12 compounds without name or structure (10 are 19Q4 compounds, e.g. imatinib and
      # bortezomib; they would otherwise keep a pseudo-ID). They take both from the named release's
      # treatment info; see drugs/map_prism.py.
      name_fallback_from: PRISM_19Q4
    response:
      format: "prism"
      normalize: false
      files:
