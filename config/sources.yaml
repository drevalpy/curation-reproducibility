          known_hash: "sha256:1737c0e1dd881c5c0381d0e115ac64b4fd363a4de77c407e70b53be825c98c16"
    transcriptomics:
      files:
        - url: "https://ndownloader.figshare.com/files/5968401"
          fname: "ExpressionSamples.txt"
          known_hash: "sha256:8efc25627103053e837739f35e866790e91e4105f2c669861542f1539ce360c1"
      keep:
        - "ExpressionSamples*"
  BeatAML2:
    # Bottomly et al. 2022, Cancer Cell. BeatAML waves 1-4.
    # Files stored via Git LFS must be fetched from media.githubusercontent.com;
    # the plain raw.githubusercontent.com host returns an LFS pointer instead.
    # All specimens are AML patient samples with no Cell Model Passports entry,
    # so the tissue label is a dataset-level constant.
    tissue: "Haematopoietic and Lymphoid"
    response:
      format: "beataml"
      normalize: true
      files:
        - url: "https://raw.githubusercontent.com/biodev/beataml2.0_data/main/beataml_wv1to4_raw_inhibitor_v4_dbgap.txt"
          fname: "beataml_raw_inhibitor.txt"
          known_hash: "sha256:02b5ee45ff758c7a401747fddb1c5129c9f681c061f0c5c4b14241691b14ae07"
        - url: "https://media.githubusercontent.com/media/biodev/beataml2.0_data/main/beataml_probit_curve_fits_v4_dbgap.txt"
          fname: "beataml_probit_curve_fits.txt"
          known_hash: "sha256:d4bc5f0d91f66314107411e0f2511adc987e29df5b83d9b03df56d3d12928314"
    transcriptomics:
      files:
        - url: "https://media.githubusercontent.com/media/biodev/beataml2.0_data/main/beataml_waves1to4_norm_exp_dbgap.txt"
          fname: "beataml_norm_exp.txt"
          known_hash: "sha256:d5745b9dbf46dba866a3c7370bb0ba73b363ecdd21e01cc1d916b4e3021e6f87"
