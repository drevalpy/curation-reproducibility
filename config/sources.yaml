        - url: "https://media.githubusercontent.com/media/biodev/beataml2.0_data/main/beataml_waves1to4_sample_mapping.xlsx"
          fname: "beataml_sample_mapping.xlsx"
          known_hash: "sha256:5581140cedd3348ec78bed878c27aa12c9538a5fab115324b91ca56aa138f0fc"

      keep:
        - "*norm_exp*"
        - "*counts*"
        - "*sample_mapping*"
  PRISM_19Q4:
    # Corsello et al. 2019, Nature Cancer. PRISM Repurposing 19Q4 secondary screen.
    # Secondary screen: 1,448 compounds × 489 cell lines, 8-point dose-response (10uM down).
    # Raw replicate-level log2 fold-change values relative to DMSO, batch-corrected with ComBat.
    # Figshare dataset doi:10.6084/m9.figshare.9393293.v4 (CC BY 4.0).
    # Gene expression: CCLE_expression.csv from the DepMap 19Q4 Public release
    # (doi:10.6084/m9.figshare.11384241.v3). Rows = DepMap cell line IDs, columns = genes.
    # Tissue and other cell-line metadata come from Cell Model Passports.
    response:
      format: "prism"
      normalize: false
      files:
        - url: "https://ndownloader.figshare.com/files/20237730"
          fname: "secondary-screen-logfold-change.csv"
          known_hash: "md5:75ec978029df82b128f989d25923a693"
        - url: "https://ndownloader.figshare.com/files/20237760"
          fname: "secondary-screen-replicate-treatment-info.csv"
          known_hash: "md5:bd7bd6f2ab7b99abf1f2d4167f40e43a"
        - url: "https://ndownloader.figshare.com/files/20237769"
          fname: "secondary-screen-cell-line-info.csv"
          known_hash: "md5:6737b4aa9fd85404fd2f0cf825b037e4"
      keep:
